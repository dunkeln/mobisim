<svg
	xmlns="http://www.w3.org/2000/svg"
	width="256"
	height="256"
	viewBox="0 0 256 256"
	fill="none"
>
	<title>Mobisim favicon</title>
	<defs>
		<radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 128) rotate(90) scale(128)">
			<stop offset="0" stop-color="#171717" />
			<stop offset="1" stop-color="#101010" />
		</radialGradient>
		<radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 128) rotate(90) scale(54)">
			<stop offset="0" stop-color="#FFF" stop-opacity="1" />
			<stop offset="0.45" stop-color="#FFF" stop-opacity="0.98" />
			<stop offset="0.8" stop-color="#FFF" stop-opacity="0.78" />
			<stop offset="1" stop-color="#FFF" stop-opacity="0" />
		</radialGradient>
		<filter id="glow" x="20" y="20" width="216" height="216" color-interpolation-filters="sRGB">
			<feGaussianBlur stdDeviation="14" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>
	<rect width="256" height="256" rx="64" fill="url(#bg)" />
	<g filter="url(#glow)">
		<circle cx="128" cy="128" r="54" fill="url(#core)" />
	</g>
	<circle cx="128" cy="128" r="22" fill="#FFF" opacity="0.92" />
</svg>
